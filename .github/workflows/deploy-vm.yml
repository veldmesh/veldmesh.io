name: Deploy to VM

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment (currently only production supported)"
        required: true
        default: production
        type: choice
        options:
          - production
      skip_harden:
        description: "Skip VM hardening (first-run setup)"
        required: false
        default: false
        type: boolean
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

env:
  # Action versions pinned to commit SHAs (updated weekly by dependabot)
  ACTIONS_CHECKOUT_SHA: 11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
  ACTIONS_SETUP_NODE_SHA: 60edb5dd545a775178f52524783378180af0d1f8 # v4.1.0
  SSH_OPTS: "-o StrictHostKeyChecking=no -o ConnectTimeout=10 -o ServerAliveInterval=10 -o ServerAliveCountMax=3"

jobs:
  label-check:
    name: Check PR label for push trigger
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      deploy_opt_in: ${{ steps.check.outputs.deploy_opt_in }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Check for deploy-vm label on merged PR
        id: check
        run: |
          # Get the PR number for this commit (if any)
          PR_NUMBER=$(gh api repos/${{ github.repository }}/commits/${{ github.sha }}/pulls --jq '.[0].number' 2>/dev/null || echo "")
          if [[ -n "$PR_NUMBER" ]]; then
            LABELS=$(gh api repos/${{ github.repository }}/pulls/$PR_NUMBER --jq '.labels[].name' 2>/dev/null || echo "")
            if echo "$LABELS" | grep -q "deploy-vm"; then
              echo "deploy_opt_in=true" >> $GITHUB_OUTPUT
            else
              echo "deploy_opt_in=false" >> $GITHUB_OUTPUT
            fi
          else
            echo "deploy_opt_in=false" >> $GITHUB_OUTPUT
          fi
        env:
          GH_TOKEN: ${{ github.token }}

  deploy:
    name: Deploy to GCP VM
    runs-on: ubuntu-latest
    environment: production
    needs: [label-check]
    # Run on workflow_dispatch, or on push to main if the merged PR had the "deploy-vm" label
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && needs.label-check.outputs.deploy_opt_in == 'true')
    env:
      VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
      VM_SSH_USER: ${{ secrets.VM_SSH_USER }}
      VM_SSH_HOST: ${{ secrets.VM_SSH_HOST }}
      VM_DEPLOY_PATH: ${{ secrets.VM_DEPLOY_PATH }}
      VM_MESH_IP: ${{ secrets.VM_MESH_IP }}
      VM_PUBLIC_ENDPOINT: ${{ secrets.VM_PUBLIC_ENDPOINT }}
      VM_MESH_PORT: ${{ secrets.VM_MESH_PORT }}
      IRONSERVER_MESH_IP: ${{ secrets.IRONSERVER_MESH_IP }}
      IRONSERVER_PUBLIC_ENDPOINT: ${{ secrets.IRONSERVER_PUBLIC_ENDPOINT }}
      WAITLIST_BEARER_TOKEN: ${{ secrets.WAITLIST_BEARER_TOKEN }}
      RELAY_IDENTITY_KEY_B64: ${{ secrets.RELAY_IDENTITY_KEY_B64 }}
      DEPLOY_DOMAIN: ${{ secrets.DEPLOY_DOMAIN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Setup Node.js
        uses: actions/setup-node@60edb5dd545a775178f52524783378180af0d1f8
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js standalone
        run: npm run build

      - name: Verify standalone output
        run: |
          if [[ ! -d ".next/standalone" ]]; then
            echo "Error: .next/standalone not found. Ensure next.config.js has output: 'standalone'"
            exit 1
          fi
          if [[ ! -f ".next/standalone/server.js" ]]; then
            echo "Error: .next/standalone/server.js not found"
            exit 1
          fi
          echo "Standalone build verified."

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          # Handle both base64-encoded and raw private keys
          if echo "${{ secrets.VM_SSH_KEY }}" | grep -q "-----BEGIN"; then
            echo "${{ secrets.VM_SSH_KEY }}" > ~/.ssh/vm_key
          else
            echo "${{ secrets.VM_SSH_KEY }}" | base64 -d > ~/.ssh/vm_key
          fi
          chmod 600 ~/.ssh/vm_key
          ssh-keyscan -H "${{ secrets.VM_SSH_HOST }}" >> ~/.ssh/known_hosts

      - name: Check if first deploy (config.toml exists)
        id: first_deploy
        run: |
          if ssh -i ~/.ssh/vm_key ${{ env.SSH_OPTS }} "${{ secrets.VM_SSH_USER }}@${{ secrets.VM_SSH_HOST }}" "test -f /etc/vel/config.toml"; then
            echo "first_deploy=false" >> $GITHUB_OUTPUT
          else
            echo "first_deploy=true" >> $GITHUB_OUTPUT
          fi

      - name: Ensure deploy directory exists with correct permissions (first deploy)
        if: steps.first_deploy.outputs.first_deploy == 'true'
        run: |
          ssh -i ~/.ssh/vm_key ${{ env.SSH_OPTS }} "${{ secrets.VM_SSH_USER }}@${{ secrets.VM_SSH_HOST }}" "
            sudo mkdir -p ${{ secrets.VM_DEPLOY_PATH }}
            sudo chown velsite:velsite ${{ secrets.VM_DEPLOY_PATH }}
            sudo chmod 750 ${{ secrets.VM_DEPLOY_PATH }}
          "

      - name: Run VM hardening (first deploy only)
        if: steps.first_deploy.outputs.first_deploy == 'true' && github.event.inputs.skip_harden != 'true'
        run: |
          scp -i ~/.ssh/vm_key ${{ env.SSH_OPTS }} deploy/harden-vm.sh "${{ secrets.VM_SSH_USER }}@${{ secrets.VM_SSH_HOST }}:/tmp/harden-vm.sh"
          ssh -i ~/.ssh/vm_key ${{ env.SSH_OPTS }} "${{ secrets.VM_SSH_USER }}@${{ secrets.VM_SSH_HOST }}" "
            sudo VM_MESH_PORT=${{ secrets.VM_MESH_PORT }} \
            IRONSERVER_MESH_IP=${{ secrets.IRONSERVER_MESH_IP }} \
            IRONSERVER_PUBLIC_ENDPOINT=${{ secrets.IRONSERVER_PUBLIC_ENDPOINT }} \
            WAITLIST_BEARER_TOKEN=${{ secrets.WAITLIST_BEARER_TOKEN }} \
            RELAY_IDENTITY_KEY_B64=${{ secrets.RELAY_IDENTITY_KEY_B64 }} \
            bash /tmp/harden-vm.sh
          "

      - name: Verify hardening (run --check)
        run: |
          ssh -i ~/.ssh/vm_key ${{ env.SSH_OPTS }} "${{ secrets.VM_SSH_USER }}@${{ secrets.VM_SSH_HOST }}" "
            sudo VM_MESH_PORT=${{ secrets.VM_MESH_PORT }} \
            IRONSERVER_MESH_IP=${{ secrets.IRONSERVER_MESH_IP }} \
            IRONSERVER_PUBLIC_ENDPOINT=${{ secrets.IRONSERVER_PUBLIC_ENDPOINT }} \
            WAITLIST_BEARER_TOKEN=${{ secrets.WAITLIST_BEARER_TOKEN }} \
            RELAY_IDENTITY_KEY_B64=${{ secrets.RELAY_IDENTITY_KEY_B64 }} \
            bash /tmp/harden-vm.sh --check
          "

      - name: Render and deploy config.toml from template
        run: |
          # Render template with secrets using envsubst for safe substitution
          export VM_MESH_IP="${{ secrets.VM_MESH_IP }}"
          export VM_PUBLIC_ENDPOINT="${{ secrets.VM_PUBLIC_ENDPOINT }}"
          export VM_MESH_PORT="${{ secrets.VM_MESH_PORT }}"
          export IRONSERVER_MESH_IP="${{ secrets.IRONSERVER_MESH_IP }}"
          export IRONSERVER_PUBLIC_ENDPOINT="${{ secrets.IRONSERVER_PUBLIC_ENDPOINT }}"
          envsubst < deploy/config.toml.tmpl > /tmp/config.toml

          # Copy to VM
          scp -i ~/.ssh/vm_key ${{ env.SSH_OPTS }} /tmp/config.toml "${{ secrets.VM_SSH_USER }}@${{ secrets.VM_SSH_HOST }}:/tmp/config.toml"
          ssh -i ~/.ssh/vm_key ${{ env.SSH_OPTS }} "${{ secrets.VM_SSH_USER }}@${{ secrets.VM_SSH_HOST }}" "
            sudo mv /tmp/config.toml /etc/vel/config.toml
            sudo chown vel:vel /etc/vel/config.toml
            sudo chmod 600 /etc/vel/config.toml
          "

      - name: Deploy Next.js app via rsync
        run: |
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/vm_key ${{ env.SSH_OPTS }}" \
            .next/standalone/ \
            "${{ secrets.VM_SSH_USER }}@${{ secrets.VM_SSH_HOST }}:${{ secrets.VM_DEPLOY_PATH }}/"

          rsync -avz --delete \
            -e "ssh -i ~/.ssh/vm_key ${{ env.SSH_OPTS }}" \
            public/ \
            "${{ secrets.VM_SSH_USER }}@${{ secrets.VM_SSH_HOST }}:${{ secrets.VM_DEPLOY_PATH }}/public/"

          rsync -avz --delete \
            -e "ssh -i ~/.ssh/vm_key ${{ env.SSH_OPTS }}" \
            .next/static/ \
            "${{ secrets.VM_SSH_USER }}@${{ secrets.VM_SSH_HOST }}:${{ secrets.VM_DEPLOY_PATH }}/.next/static/"

      - name: Deploy systemd units
        run: |
          scp -i ~/.ssh/vm_key ${{ env.SSH_OPTS }} deploy/veldsite.service "${{ secrets.VM_SSH_USER }}@${{ secrets.VM_SSH_HOST }}:/tmp/veldsite.service"
          scp -i ~/.ssh/vm_key ${{ env.SSH_OPTS }} deploy/vel-daemon.service "${{ secrets.VM_SSH_USER }}@${{ secrets.VM_SSH_HOST }}:/tmp/vel-daemon.service"
          ssh -i ~/.ssh/vm_key ${{ env.SSH_OPTS }} "${{ secrets.VM_SSH_USER }}@${{ secrets.VM_SSH_HOST }}" "
            sudo mv /tmp/veldsite.service /etc/systemd/system/veldsite.service
            sudo mv /tmp/vel-daemon.service /etc/systemd/system/vel-daemon.service
            sudo systemctl daemon-reload
          "

      - name: Restart services
        run: |
          ssh -i ~/.ssh/vm_key ${{ env.SSH_OPTS }} "${{ secrets.VM_SSH_USER }}@${{ secrets.VM_SSH_HOST }}" "
            sudo systemctl restart veld-daemon veldsite
            sudo systemctl status veld-daemon --no-pager
            sudo systemctl status veldsite --no-pager
          "

      - name: Wait for services to be ready
        run: |
          # Poll for services to become active (max 60 seconds)
          for i in {1..30}; do
            if ssh -i ~/.ssh/vm_key ${{ env.SSH_OPTS }} "${{ secrets.VM_SSH_USER }}@${{ secrets.VM_SSH_HOST }}" \
              "systemctl is-active --quiet veld-daemon && systemctl is-active --quiet veldsite"; then
              echo "Services are active"
              break
            fi
            if [[ $i -eq 30 ]]; then
              echo "Timeout waiting for services to start"
              exit 1
            fi
            sleep 2
          done

      - name: Verify deployment
        run: |
          # Check health endpoint or landing page
          DOMAIN="${{ secrets.DEPLOY_DOMAIN }}"
          if [[ -z "$DOMAIN" ]]; then
            echo "DEPLOY_DOMAIN secret not set, skipping HTTP verification"
            exit 0
          fi
          # Retry curl with backoff (max 30 seconds)
          for i in {1..15}; do
            if curl -fSs --max-time 10 "https://$DOMAIN" > /dev/null; then
              echo "✓ Landing page accessible"
              break
            fi
            if [[ $i -eq 15 ]]; then
              echo "✗ Landing page not accessible after retries"
              exit 1
            fi
            sleep 2
          done
          # Check waitlist endpoint responds (may return 202 on mesh failure)
          for i in {1..15}; do
            HTTP_CODE=$(curl -fSs --max-time 10 -X POST "https://$DOMAIN/api/waitlist" \
              -H "Content-Type: application/json" \
              -d '{"email":"test@example.com"}' \
              -w "%{http_code}" -o /dev/null || echo "000")
            if [[ "$HTTP_CODE" =~ ^(200|202)$ ]]; then
              echo "✓ Waitlist endpoint responds (HTTP $HTTP_CODE)"
              break
            fi
            if [[ $i -eq 15 ]]; then
              echo "✗ Waitlist endpoint not responding correctly (HTTP $HTTP_CODE)"
              exit 1
            fi
            sleep 2
          done

      - name: Verify veld daemon peer connection
        run: |
          ssh -i ~/.ssh/vm_key ${{ env.SSH_OPTS }} "${{ secrets.VM_SSH_USER }}@${{ secrets.VM_SSH_HOST }}" "
            sudo journalctl -u vel-daemon --no-pager -n 50 | grep -i 'peer.*connected\|connected.*peer' && echo '✓ Veld daemon shows peer connected' || echo '⚠ Veld daemon peer connection not yet visible in logs'
          "

      - name: Verify systemd user contexts
        run: |
          ssh -i ~/.ssh/vm_key ${{ env.SSH_OPTS }} "${{ secrets.VM_SSH_USER }}@${{ secrets.VM_SSH_HOST }}" "
            echo 'velsite user:' \$(systemctl show -p User --value veldsite)
            echo 'vel-daemon user:' \$(systemctl show -p User --value vel-daemon)
            test \"\$(systemctl show -p User --value veldsite)\" = \"velsite\" && echo '✓ veldsite runs as velsite'
            test \"\$(systemctl show -p User --value vel-daemon)\" = \"vel\" && echo '✓ vel-daemon runs as vel'
          "