name: Deploy to VM

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment (currently only production supported)"
        required: true
        default: production
        type: choice
        options:
          - production
      skip_harden:
        description: "Skip VM hardening (first-run setup)"
        required: false
        default: false
        type: boolean
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

env:
  # Action versions pinned to commit SHAs (updated weekly by dependabot)
  ACTIONS_CHECKOUT_SHA: 11bd71901bbe5b1630ceea73d27597364c9af683
  ACTIONS_SETUP_NODE_SHA: 60edb5dd545a775178f52524783378180af0d1f8
  # SSH options: accept-new prevents MITM on first connect (rejects changed keys)
  # Pre-populate known_hosts via ssh-keyscan from trusted source for production
  SSH_OPTS: "-o StrictHostKeyChecking=accept-new -o ConnectTimeout=10 -o ServerAliveInterval=10 -o ServerAliveCountMax=3"

jobs:
  label-check:
    name: Check PR label for push trigger
    runs-on: ubuntu-latest
    outputs:
      deploy_opt_in: ${{ steps.check.outputs.deploy_opt_in }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Check for deploy-vm label on merged PR
        id: check
        run: |
          # On workflow_dispatch, always allow deployment
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "deploy_opt_in=true" >> $GITHUB_OUTPUT
            exit 0
          fi
          # On push, check for deploy-vm label on merged PR
          PR_NUMBER=$(gh api repos/${{ github.repository }}/commits/${{ github.sha }}/pulls --jq '.[0].number' 2>/dev/null || echo "")
          if [[ -n "$PR_NUMBER" ]]; then
            LABELS=$(gh api repos/${{ github.repository }}/pulls/$PR_NUMBER --jq '.labels[].name' 2>/dev/null || echo "")
            if echo "$LABELS" | grep -q "deploy-vm"; then
              echo "deploy_opt_in=true" >> $GITHUB_OUTPUT
            else
              echo "deploy_opt_in=false" >> $GITHUB_OUTPUT
            fi
          else
            echo "deploy_opt_in=false" >> $GITHUB_OUTPUT
          fi
        env:
          GH_TOKEN: ${{ github.token }}

  deploy:
    name: Deploy to GCP VM
    runs-on: ubuntu-latest
    environment: production
    needs: [label-check]
    # Run on workflow_dispatch, or on push to main if the merged PR had the "deploy-vm" label
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && needs.label-check.outputs.deploy_opt_in == 'true')
    env:
      VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
      VM_SSH_USER: ${{ secrets.VM_SSH_USER }}
      VM_SSH_HOST: ${{ secrets.VM_SSH_HOST }}
      VM_DEPLOY_PATH: ${{ secrets.VM_DEPLOY_PATH }}
      VM_MESH_IP: ${{ secrets.VM_MESH_IP }}
      VM_PUBLIC_ENDPOINT: ${{ secrets.VM_PUBLIC_ENDPOINT }}
      VM_MESH_PORT: ${{ secrets.VM_MESH_PORT }}
      IRONSERVER_MESH_IP: ${{ secrets.IRONSERVER_MESH_IP }}
      IRONSERVER_PUBLIC_ENDPOINT: ${{ secrets.IRONSERVER_PUBLIC_ENDPOINT }}
      WAITLIST_BEARER_TOKEN: ${{ secrets.WAITLIST_BEARER_TOKEN }}
      RELAY_IDENTITY_KEY_B64: ${{ secrets.RELAY_IDENTITY_KEY_B64 }}
      DEPLOY_DOMAIN: ${{ secrets.DEPLOY_DOMAIN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && needs.label-check.outputs.deploy_opt_in == 'true')

      - name: Setup Node.js
        uses: actions/setup-node@60edb5dd545a775178f52524783378180af0d1f8
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && needs.label-check.outputs.deploy_opt_in == 'true')
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && needs.label-check.outputs.deploy_opt_in == 'true')
        run: npm ci

      - name: Build Next.js standalone
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && needs.label-check.outputs.deploy_opt_in == 'true')
        run: npm run build

      - name: Verify standalone output
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && needs.label-check.outputs.deploy_opt_in == 'true')
        run: |
          if [[ ! -d ".next/standalone" ]]; then
            echo "Error: .next/standalone not found. Ensure next.config.js has output: 'standalone'"
            exit 1
          fi
          if [[ ! -f ".next/standalone/server.js" ]]; then
            echo "Error: .next/standalone/server.js not found"
            exit 1
          fi
          echo "Standalone build verified."

      - name: Install gettext-base for envsubst
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && needs.label-check.outputs.deploy_opt_in == 'true')
        run: sudo apt-get update && sudo apt-get install -y gettext-base

      - name: Configure SSH
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && needs.label-check.outputs.deploy_opt_in == 'true')
        run: |
          mkdir -p ~/.ssh
          # Handle both base64-encoded and raw private keys using printf for multi-line support
          if printf '%s' "${{ secrets.VM_SSH_KEY }}" | grep -q "-----BEGIN"; then
            printf '%s' "${{ secrets.VM_SSH_KEY }}" > ~/.ssh/vm_key
          else
            printf '%s' "${{ secrets.VM_SSH_KEY }}" | base64 -d > ~/.ssh/vm_key
          fi
          chmod 600 ~/.ssh/vm_key
          # Pre-populate known_hosts with VM host key (TOFU on first deploy, then enforce)
          ssh-keyscan -H "${{ secrets.VM_SSH_HOST }}" >> ~/.ssh/known_hosts

      - name: Check if first deploy (config.toml exists)
        id: first_deploy
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && needs.label-check.outputs.deploy_opt_in == 'true')
        run: |
          if ssh -i ~/.ssh/vm_key ${{ env.SSH_OPTS }} "${{ secrets.VM_SSH_USER }}@${{ secrets.VM_SSH_HOST }}" "test -f /etc/vel/config.toml"; then
            echo "first_deploy=false" >> $GITHUB_OUTPUT
          else
            echo "first_deploy=true" >> $GITHUB_OUTPUT
          fi

      - name: Copy hardening script to VM (restricted location)
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && needs.label-check.outputs.deploy_opt_in == 'true')
        run: |
          scp -i ~/.ssh/vm_key ${{ env.SSH_OPTS }} deploy/harden-vm.sh "${{ secrets.VM_SSH_USER }}@${{ secrets.VM_SSH_HOST }}:/root/harden-vm.sh"
          ssh -i ~/.ssh/vm_key ${{ env.SSH_OPTS }} "${{ secrets.VM_SSH_USER }}@${{ secrets.VM_SSH_HOST }}" "chmod 700 /root/harden-vm.sh"

      - name: Run VM hardening (first deploy only)
        if: (steps.first_deploy.outputs.first_deploy == 'true' && github.event.inputs.skip_harden != 'true') && (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && needs.label-check.outputs.deploy_opt_in == 'true'))
        run: |
          ssh -i ~/.ssh/vm_key ${{ env.SSH_OPTS }} "${{ secrets.VM_SSH_USER }}@${{ secrets.VM_SSH_HOST }}" "
            sudo /root/harden-vm.sh
          "

      - name: Render and deploy config.toml from template
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && needs.label-check.outputs.deploy_opt_in == 'true')
        run: |
          # Render template with secrets using envsubst for safe substitution
          export VM_MESH_IP="${{ secrets.VM_MESH_IP }}"
          export VM_PUBLIC_ENDPOINT="${{ secrets.VM_PUBLIC_ENDPOINT }}"
          export VM_MESH_PORT="${{ secrets.VM_MESH_PORT }}"
          export IRONSERVER_MESH_IP="${{ secrets.IRONSERVER_MESH_IP }}"
          export IRONSERVER_PUBLIC_ENDPOINT="${{ secrets.IRONSERVER_PUBLIC_ENDPOINT }}"
          envsubst < deploy/config.toml.tmpl > /tmp/config.toml

          # Validate rendered TOML
          python3 -c "import tomllib; tomllib.load(open('/tmp/config.toml', 'rb'))"
          echo "config.toml TOML validation passed"

          # Copy to VM
          scp -i ~/.ssh/vm_key ${{ env.SSH_OPTS }} /tmp/config.toml "${{ secrets.VM_SSH_USER }}@${{ secrets.VM_SSH_HOST }}:/tmp/config.toml"
          ssh -i ~/.ssh/vm_key ${{ env.SSH_OPTS }} "${{ secrets.VM_SSH_USER }}@${{ secrets.VM_SSH_HOST }}" "
            sudo mkdir -p /etc/vel
            sudo mv /tmp/config.toml /etc/vel/config.toml
            sudo chown vel:vel /etc/vel/config.toml
            sudo chmod 600 /etc/vel/config.toml
          "

      - name: Render and deploy systemd units with deploy path
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && needs.label-check.outputs.deploy_opt_in == 'true')
        run: |
          # Render veldsite.service with the deploy path
          export DEPLOY_PATH="${{ secrets.VM_DEPLOY_PATH }}"
          envsubst < deploy/veldsite.service.tmpl > /tmp/veldsite.service
          # Validate systemd unit
          systemd-analyze verify /tmp/veldsite.service
          echo "veldsite.service validation passed"
          cp deploy/vel-daemon.service /tmp/vel-daemon.service
          systemd-analyze verify /tmp/vel-daemon.service
          echo "vel-daemon.service validation passed"
          scp -i ~/.ssh/vm_key ${{ env.SSH_OPTS }} /tmp/veldsite.service "${{ secrets.VM_SSH_USER }}@${{ secrets.VM_SSH_HOST }}:/tmp/veldsite.service"
          scp -i ~/.ssh/vm_key ${{ env.SSH_OPTS }} /tmp/vel-daemon.service "${{ secrets.VM_SSH_USER }}@${{ secrets.VM_SSH_HOST }}:/tmp/vel-daemon.service"
          ssh -i ~/.ssh/vm_key ${{ env.SSH_OPTS }} "${{ secrets.VM_SSH_USER }}@${{ secrets.VM_SSH_HOST }}" "
            sudo mv /tmp/veldsite.service /etc/systemd/system/veldsite.service
            sudo mv /tmp/vel-daemon.service /etc/systemd/system/vel-daemon.service
            sudo systemctl daemon-reload
          "

      - name: Render and deploy env file
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && needs.label-check.outputs.deploy_opt_in == 'true')
        run: |
          # Render env file with secrets (deployed every run for secret rotation)
          cat > /tmp/velsite.env <<'ENVEOF'
IRONSERVER_MESH_IP=${{ secrets.IRONSERVER_MESH_IP }}
IRONSERVER_PUBLIC_ENDPOINT=${{ secrets.IRONSERVER_PUBLIC_ENDPOINT }}
WAITLIST_BEARER_TOKEN=${{ secrets.WAITLIST_BEARER_TOKEN }}
ENVEOF
          scp -i ~/.ssh/vm_key ${{ env.SSH_OPTS }} /tmp/velsite.env "${{ secrets.VM_SSH_USER }}@${{ secrets.VM_SSH_HOST }}:/tmp/velsite.env"
          ssh -i ~/.ssh/vm_key ${{ env.SSH_OPTS }} "${{ secrets.VM_SSH_USER }}@${{ secrets.VM_SSH_HOST }}" "
            sudo mv /tmp/velsite.env ${{ secrets.VM_DEPLOY_PATH }}/.env
            sudo chown velsite:velsite ${{ secrets.VM_DEPLOY_PATH }}/.env
            sudo chmod 600 ${{ secrets.VM_DEPLOY_PATH }}/.env
          "

      - name: Render and deploy relay identity key (if secret exists)
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && needs.label-check.outputs.deploy_opt_in == 'true')
        run: |
          if [[ -n "${{ secrets.RELAY_IDENTITY_KEY_B64 }}" ]]; then
            printf '%s' "${{ secrets.RELAY_IDENTITY_KEY_B64 }}" | base64 -d > /tmp/relay-identity.key
            scp -i ~/.ssh/vm_key ${{ env.SSH_OPTS }} /tmp/relay-identity.key "${{ secrets.VM_SSH_USER }}@${{ secrets.VM_SSH_HOST }}:/tmp/relay-identity.key"
            ssh -i ~/.ssh/vm_key ${{ env.SSH_OPTS }} "${{ secrets.VM_SSH_USER }}@${{ secrets.VM_SSH_HOST }}" "
              sudo mkdir -p /etc/velmesh
              sudo mv /tmp/relay-identity.key /etc/velmesh/relay-identity.key
              sudo chown velmesh-relay:velmesh-relay /etc/velmesh/relay-identity.key
              sudo chmod 600 /etc/velmesh/relay-identity.key
            "
            echo "Relay identity key deployed"
          else
            echo "RELAY_IDENTITY_KEY_B64 not set, skipping relay key deployment"
          fi

      - name: Verify vel-daemon binary exists on VM
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && needs.label-check.outputs.deploy_opt_in == 'true')
        run: |
          ssh -i ~/.ssh/vm_key ${{ env.SSH_OPTS }} "${{ secrets.VM_SSH_USER }}@${{ secrets.VM_SSH_HOST }}" "
            if [[ ! -x /usr/local/bin/vel-daemon ]]; then
              echo 'Error: /usr/local/bin/vel-daemon not found or not executable'
              echo 'The vel-daemon binary must be pre-installed on the VM before deployment.'
              exit 1
            fi
            echo '✓ vel-daemon binary found at /usr/local/bin/vel-daemon'
          "

      - name: Deploy Next.js app via rsync
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && needs.label-check.outputs.deploy_opt_in == 'true')
        run: |
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/vm_key ${{ env.SSH_OPTS }}" \
            --rsync-path="sudo rsync" \
            .next/standalone/ \
            "${{ secrets.VM_SSH_USER }}@${{ secrets.VM_SSH_HOST }}:${{ secrets.VM_DEPLOY_PATH }}/"

          rsync -avz --delete \
            -e "ssh -i ~/.ssh/vm_key ${{ env.SSH_OPTS }}" \
            --rsync-path="sudo rsync" \
            public/ \
            "${{ secrets.VM_SSH_USER }}@${{ secrets.VM_SSH_HOST }}:${{ secrets.VM_DEPLOY_PATH }}/public/"

          rsync -avz --delete \
            -e "ssh -i ~/.ssh/vm_key ${{ env.SSH_OPTS }}" \
            --rsync-path="sudo rsync" \
            .next/static/ \
            "${{ secrets.VM_SSH_USER }}@${{ secrets.VM_SSH_HOST }}:${{ secrets.VM_DEPLOY_PATH }}/.next/static/"

      - name: Fix file ownership after rsync
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && needs.label-check.outputs.deploy_opt_in == 'true')
        run: |
          ssh -i ~/.ssh/vm_key ${{ env.SSH_OPTS }} "${{ secrets.VM_SSH_USER }}@${{ secrets.VM_SSH_HOST }}" "
            sudo chown -R velsite:velsite ${{ secrets.VM_DEPLOY_PATH }}
          "

      - name: Reload vel-daemon after config.toml changes
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && needs.label-check.outputs.deploy_opt_in == 'true')
        run: |
          ssh -i ~/.ssh/vm_key ${{ env.SSH_OPTS }} "${{ secrets.VM_SSH_USER }}@${{ secrets.VM_SSH_HOST }}" "
            sudo systemctl reload vel-daemon || sudo systemctl restart vel-daemon
          "

      - name: Enable and start services
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && needs.label-check.outputs.deploy_opt_in == 'true')
        run: |
          ssh -i ~/.ssh/vm_key ${{ env.SSH_OPTS }} "${{ secrets.VM_SSH_USER }}@${{ secrets.VM_SSH_HOST }}" "
            sudo systemctl enable --now veld-daemon veldsite
            sudo systemctl status veld-daemon --no-pager
            sudo systemctl status veldsite --no-pager
          "

      - name: Wait for services to be ready
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && needs.label-check.outputs.deploy_opt_in == 'true')
        run: |
          # Poll for services to become active (max 60 seconds)
          for i in {1..30}; do
            if ssh -i ~/.ssh/vm_key ${{ env.SSH_OPTS }} "${{ secrets.VM_SSH_USER }}@${{ secrets.VM_SSH_HOST }}" \
              "systemctl is-active --quiet veld-daemon && systemctl is-active --quiet veldsite"; then
              echo "Services are active"
              break
            fi
            if [[ $i -eq 30 ]]; then
              echo "Timeout waiting for services to start"
              exit 1
            fi
            sleep 2
          done

      - name: Verify hardening (run --check)
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && needs.label-check.outputs.deploy_opt_in == 'true')
        run: |
          ssh -i ~/.ssh/vm_key ${{ env.SSH_OPTS }} "${{ secrets.VM_SSH_USER }}@${{ secrets.VM_SSH_HOST }}" "
            sudo /root/harden-vm.sh --check
          "

      - name: Verify deployment
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && needs.label-check.outputs.deploy_opt_in == 'true')
        run: |
          # Check health endpoint or landing page
          DOMAIN="${{ secrets.DEPLOY_DOMAIN }}"
          if [[ -z "$DOMAIN" ]]; then
            echo "Error: DEPLOY_DOMAIN secret not set, cannot verify deployment"
            exit 1
          fi
          # Retry curl with backoff (max 30 seconds)
          for i in {1..15}; do
            if curl -fSs --max-time 10 "https://$DOMAIN" > /dev/null; then
              echo "✓ Landing page accessible"
              break
            fi
            if [[ $i -eq 15 ]]; then
              echo "✗ Landing page not accessible after retries"
              exit 1
            fi
            sleep 2
          done
          # Check waitlist endpoint responds (may return 202 on mesh failure)
          for i in {1..15}; do
            HTTP_CODE=$(curl -fSs --max-time 10 -X POST "https://$DOMAIN/api/waitlist" \
              -H "Content-Type: application/json" \
              -d '{"email":"test@example.com"}' \
              -w "%{http_code}" -o /dev/null || echo "000")
            if [[ "$HTTP_CODE" =~ ^(200|202)$ ]]; then
              echo "✓ Waitlist endpoint responds (HTTP $HTTP_CODE)"
              break
            fi
            if [[ $i -eq 15 ]]; then
              echo "✗ Waitlist endpoint not responding correctly (HTTP $HTTP_CODE)"
              exit 1
            fi
            sleep 2
          done

      - name: Verify veld daemon peer connection
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && needs.label-check.outputs.deploy_opt_in == 'true')
        run: |
          ssh -i ~/.ssh/vm_key ${{ env.SSH_OPTS }} "${{ secrets.VM_SSH_USER }}@${{ secrets.VM_SSH_HOST }}" "
            sudo journalctl -u vel-daemon --no-pager -n 50 | grep -i 'peer.*connected\|connected.*peer' && echo '✓ Veld daemon shows peer connected' || echo '⚠ Veld daemon peer connection not yet visible in logs'
          "

      - name: Verify systemd user contexts
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && needs.label-check.outputs.deploy_opt_in == 'true')
        run: |
          ssh -i ~/.ssh/vm_key ${{ env.SSH_OPTS }} "${{ secrets.VM_SSH_USER }}@${{ secrets.VM_SSH_HOST }}" "
            echo 'velsite user:' \$(systemctl show -p User --value veldsite)
            echo 'vel-daemon user:' \$(systemctl show -p User --value vel-daemon)
            test \"\$(systemctl show -p User --value veldsite)\" = \"velsite\" && echo '✓ veldsite runs as velsite'
            test \"\$(systemctl show -p User --value vel-daemon)\" = \"vel\" && echo '✓ vel-daemon runs as vel'
          "

      - name: Cleanup temporary files on VM
        if: always() && (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && needs.label-check.outputs.deploy_opt_in == 'true'))
        run: |
          ssh -i ~/.ssh/vm_key ${{ env.SSH_OPTS }} "${{ secrets.VM_SSH_USER }}@${{ secrets.VM_SSH_HOST }}" "
            sudo rm -f /tmp/config.toml /tmp/veldsite.service /tmp/vel-daemon.service /tmp/velsite.env /tmp/relay-identity.key /root/harden-vm.sh
          " || true
